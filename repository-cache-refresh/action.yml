name: Repository cache refresh
description: Warm Bazel repository cache for all variants and delete old caches.

inputs:
  variants:
    description: |
      Newline-separated list of fetch variants in the format <config>|<targets>.
      Use an empty config (|<targets>) to run fetch without --config.
      Example: x86_64-linux|//...
    required: true
  old-caches-json:
    description: JSON string containing old cache IDs (from repository-cache-check output).
    required: true
  _skip_cache_delete:
    description: For debugging purposes only.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Warm Bazel repository cache for all variants (with retries)
      shell: bash
      env:
        VARIANTS_INPUT: ${{ inputs.variants }}
      run: |
        set -euo pipefail

        mapfile -t variants < <(printf '%s\n' "$VARIANTS_INPUT" | sed '/^[[:space:]]*$/d')
        if [ "${#variants[@]}" -eq 0 ]; then
          echo "No variants were provided."
          exit 1
        fi

        max_attempts=10
        failed_variants=()

        for variant in "${variants[@]}"; do
          config="${variant%%|*}"
          targets="${variant#*|}"
          config_display="${config:-<default>}"
          success=false

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Running bazel fetch for config '${config_display}' and targets '${targets}' (attempt ${attempt}/${max_attempts})"
            if [ -n "${config}" ]; then
              bazel_fetch_cmd=(bazel fetch "--config=${config}")
            else
              bazel_fetch_cmd=(bazel fetch)
            fi

            if "${bazel_fetch_cmd[@]}" ${targets}; then
              echo "Successfully fetched dependencies for config '${config_display}' and targets '${targets}'"
              success=true
              break
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              backoff_seconds=$((attempt * 20))
              echo "bazel fetch failed (likely transient). Retrying in ${backoff_seconds}s..."
              sleep "$backoff_seconds"
            fi
          done

          if [ "$success" != "true" ]; then
            echo "bazel fetch failed for config '${config_display}' and targets '${targets}' after ${max_attempts} attempts"
            failed_variants+=("${config}|${targets}")
          fi
        done

        if [ "${#failed_variants[@]}" -ne 0 ]; then
          echo "Bazel fetch failed for the following variants:"
          for variant in "${failed_variants[@]}"; do
            echo "  - ${variant}"
          done
          exit 1
        fi

    - name: Delete old caches
      if: ${{ inputs._skip_cache_delete != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        OLD_CACHES_JSON: ${{ inputs.old-caches-json }}
      run: |
        set -euo pipefail
        if [ -n "$OLD_CACHES_JSON" ] && [ "$OLD_CACHES_JSON" != "[]" ]; then
          num_caches=$(echo "$OLD_CACHES_JSON" | jq 'length')
          echo "Deleting $num_caches old caches..."
          echo "$OLD_CACHES_JSON" | jq -r '.[].id' | while read -r cache_id; do
            echo "Deleting old cache: $cache_id"
            gh cache delete "$cache_id" --repo ${{ github.repository }} || true
          done
        else
          echo "No old caches to delete"
        fi
