name: Internal Setup Bazel
description: Vendored setup-bazel implementation used by setup-bazel-cache.

inputs:
  bazelisk-cache:
    description: Caches Bazelisk downloads based on .bazelversion
    required: false
    default: "false"
  bazelisk-version:
    description: The Bazelisk version to download and use if necessary
    default: ""
  bazelrc:
    description: Extra contents to write to user .bazelrc
    required: false
    default: ""
  cache-optimized:
    description: "Use timestamp-based cache keys. Applies to disk caches."
    required: false
    default: "false"
  cache-save:
    description: Whether to save caches. Set to false for pull requests to allow restores but prevent saves.
    required: false
    default: "true"
  skip-cache-restore:
    description: Whether to skip restoring caches. Useful for creating fresh caches while still saving at the end.
    required: false
    default: "false"
  skip-disk-cache-restore:
    description: Whether to skip only the Bazel disk-cache restore.
    required: false
    default: "false"
  skip-repository-cache-restore:
    description: Whether to skip only the Bazel repository-cache restore.
    required: false
    default: "false"
  cache-version:
    description: Version of all caches
    required: false
    default: "1"
  disk-cache:
    description: Cache actions outputs based on BUILD
    required: false
    default: "false"
  external-cache:
    description: Cache external 10MB+ repositories based on MODULE.bazel/WORKSPACE
    required: false
    default: ""
  google-credentials:
    description: Google Cloud account key for remote cache
    required: false
    default: ""
  module-root:
    description: Bazel module root directory. Default is `.`
    required: false
    default: "."
  output-base:
    description: Bazel output base directory. Default is $HOME/.cache/bazel (POSIX) or D:/_bazel (Windows)
    required: false
    default: ""
  repository-cache:
    description: Cache repositories based on MODULE.bazel/WORKSPACE
    required: false
    default: "false"
  token:
    description: GitHub token to query Bazelisk releases
    required: false
    default: ${{ github.token }}

runs:
  using: node24
  main: dst/main/index.js
  post: dst/post/index.js
  post-if: "!cancelled()"
