name: Setup Bazel Cache
description: Configures Bazel 8.6+ caching with opinionated defaults.

inputs:
  repository-cache-restore:
    description: Restore the shared repository cache. Accepts true, false, or auto; auto rebuilds it on a cache-saving branch when MODULE.bazel.lock changed.
    required: false
    default: "auto"
  repository-cache-save:
    description: Save the shared repository cache on a configured cache-saving branch. Accepts true, false, or auto.
    required: false
    default: "auto"
  disk-cache-restore:
    description: Restore the Bazel disk cache. Accepts true, false, or auto; auto rebuilds it on a cache-saving branch when MODULE.bazel.lock changed.
    required: false
    default: "auto"
  disk-cache-save:
    description: Save the Bazel disk cache on a configured cache-saving branch. Accepts true, false, or auto.
    required: false
    default: "false"
  disk-cache-key:
    description: Stable disk-cache key for this workflow job and matrix configuration (1-400 printable characters, no commas).
    required: true
  cache-save-branches:
    description: Newline-separated branch glob patterns allowed to save caches. Empty uses the repository default branch.
    required: false
    default: ""
outputs:
  cache-save:
    description: Whether this ref is allowed to save caches in the post action.
  disk-cache-restore:
    description: Resolved disk-cache restore decision.
  repository-cache-restore:
    description: Resolved repository-cache restore decision.
  disk-cache-save:
    description: Whether this run will save the Bazel disk cache.
  skip-bazelisk-cache-restore:
    description: Resolved Bazelisk-cache restore decision.
  skip-disk-cache-restore:
    description: Resolved disk-cache restore decision.
  skip-repository-cache-restore:
    description: Resolved repository-cache restore decision.
  repository-cache-save:
    description: Whether this run will save the shared repository cache.
  failed-job-cache-save:
    description: Whether Bazelisk was restored exactly and all generational caches may be saved after a later step fails.
  bazelisk-cache-restored:
    description: "Bazelisk restore result: true, false, partial, skipped, or unknown."
  disk-cache-restored:
    description: "Disk-cache restore result: true, false, partial, skipped, or unknown."
  repository-cache-restored:
    description: "Repository-cache restore result: true, false, partial, skipped, or unknown."
  checkout-history:
    description: "How history for automatic detection was obtained: skipped, existing, deepened, or fetched."
  lock-file-changed:
    description: "Whether MODULE.bazel.lock changed: true, false, or unknown."

runs:
  using: node24
  main: dst/main/index.js
  post: dst/post/index.js
  post-if: success() || (failure() && env.SETUP_BAZEL_CACHE_ADDITIVE_SAVE == 'true')
