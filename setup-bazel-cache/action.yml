name: Setup Bazel Cache
description: Configures Bazel 8.6+ caching with opinionated defaults.

inputs:
  bazelisk-cache-restore:
    description: >
      Restore the Bazelisk cache.
      Accepts true or false.
    required: false
    default: "true"

  bazelisk-cache-save:
    description: >
      Save the Bazelisk cache.
      Accepts true or false. Saving is still limited to configured
      cache-saving branches.
    required: false
    default: "true"

  repository-cache-restore:
    description: >
      Restore the shared repository cache.
      Accepts true, false, or auto.
      With auto, the cache is restored unless it should be rebuilt on a
      cache-saving branch because MODULE.bazel.lock changed.
    required: false
    default: "auto"

  repository-cache-save:
    description: >
      Save the shared repository cache.
      Accepts true, false, or auto.
      With auto, the cache is saved only on a configured cache-saving branch
      when saving is required by the resolved cache policy.
    required: false
    default: "auto"

  disk-cache-restore:
    description: >
      Restore the Bazel disk cache.
      Accepts true, false, or auto.
      With auto, the cache is restored unless it should be rebuilt on a
      cache-saving branch because MODULE.bazel.lock changed.
    required: false
    default: "auto"

  disk-cache-save:
    description: >
      Save the Bazel disk cache.
      Accepts true, false, or auto.
      With auto, the cache is saved only on a configured cache-saving branch
      when saving is required by the resolved cache policy.
    required: false
    default: "false"

  disk-cache-key:
    description: >
      Stable disk-cache key for this workflow job and matrix configuration
      (1-400 printable characters, no commas).
    required: true

  cache-save-branch-patterns:
    description: |
      Newline-separated branch glob patterns allowed to save caches.
      If empty, only the repository default branch may save caches.
    required: false
    default: ""

outputs:
  cache-save-allowed:
    description: Whether this ref is allowed to save caches in the post action.

  repository-cache-restore:
    description: Resolved repository-cache restore decision.

  repository-cache-save:
    description: Resolved repository-cache save decision.

  disk-cache-restore:
    description: Resolved disk-cache restore decision.

  bazelisk-cache-save:
    description: Resolved Bazelisk-cache save decision.

  disk-cache-save:
    description: Resolved disk-cache save decision.

  bazelisk-cache-restore:
    description: Resolved Bazelisk-cache restore decision.

  failed-job-cache-save-allowed:
    description: >
      Whether every selected cache was restored sufficiently for an additive
      save after a later workflow step fails.

  bazelisk-cache-restored:
    description: >
      Bazelisk cache restore result: true, false, partial, skipped, or unknown.

  disk-cache-restored:
    description: >
      Disk-cache restore result: true, false, partial, skipped, or unknown.

  repository-cache-restored:
    description: >
      Repository-cache restore result: true, false, partial, skipped, or unknown.

  checkout-history:
    description: >
      How history for automatic detection was obtained:
      skipped, existing, deepened, or fetched.

  lock-file-changed:
    description: >
      Whether MODULE.bazel.lock changed: true, false, or unknown.

runs:
  using: node24
  main: dst/main/index.js
  post: dst/post/index.js
  post-if: success() || (failure() && env.SETUP_BAZEL_CACHE_ADDITIVE_SAVE == 'true')
