name: Setup Bazel Cache
description: Configures Bazel 8.6+ caching with opinionated defaults and automations.

inputs:
  token:
    description: GitHub token used to remove the previous repository cache generation
    required: false
    default: ${{ github.token }}

  disk-cache-key:
    description: >
      Stable disk-cache key for this workflow job and matrix configuration
      (1-400 printable characters, no commas).
    required: true

  cache-save-branch-patterns:
    description: |
      Newline-separated branch glob patterns allowed to save caches.
      If empty, only the repository default branch may save caches.
    required: false
    default: ""

  # cache flags:

  bazelisk-cache-restore:
    description: >
      Restore the Bazelisk cache.
      Accepts true or false.
    required: false
    default: "true"

  bazelisk-cache-save:
    description: >
      Save the Bazelisk cache.
      Accepts true or false.
      Note: even with true, saving is still limited to configured cache-saving branches (see cache-save-branch-patterns).
    required: false
    default: "true"

  repository-cache-restore:
    description: >
      Restore the shared repository cache.
      Accepts true or false.
    required: false
    default: "true"

  repository-cache-save:
    description: >
      Save the shared repository cache.
      Accepts true, false, or auto.
      With auto, save when the cache is empty at the start of the job or grows by at least 10%.
      After a successful auto upload, the previous generation is removed when the token permits it.
      Saving is still limited to configured cache-saving branches (see cache-save-branch-patterns).
    required: false
    default: "auto"

  disk-cache-restore:
    description: >
      Restore the Bazel disk cache.
      Accepts true, false, or auto.
      With auto, the action decides whether restoring the existing cache is appropriate
      or a new cache should be built.
    required: false
    default: "auto"

  disk-cache-save:
    description: >
      Save the Bazel disk cache.
      Accepts true or false.
      Note: even with true, saving is still limited to configured cache-saving branches (see cache-save-branch-patterns).
    required: false
    default: "true"

outputs:
  cache-save-branch-evaluated:
    description: >
      Whether this ref is allowed to save caches in the post action.
      Reports true or false.

  bazelisk-cache-restored:
    description: >
      Whether the Bazelisk cache was restored.
      Reports true or false.

  disk-cache-restored:
    description: >
      Whether the bazel disk cache was restored.
      Reports true or false.

  repository-cache-restored:
    description: >
      Whether the bazel repository cache was restored.
      Reports true or false.

  # potentially internal? not sure yet.

  _checkout-history:
    description: >
      How history for automatic detection was obtained:
      skipped, existing, deepened, or fetched.

  _lock-file-changed:
    description: >
      Whether MODULE.bazel.lock changed: true, false, or unknown.

  _failed-job-cache-save-allowed:
    description: >
      Whether every selected cache was restored sufficiently for an additive
      save after a later workflow step fails.

runs:
  using: node24
  main: dst/main/index.js
  post: dst/post/index.js
  post-if: success() || (failure() && env.SETUP_BAZEL_CACHE_ADDITIVE_SAVE == 'true')
