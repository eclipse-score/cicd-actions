name: Setup Bazel Cache
description: Configures opinionated Bazel caches on Linux. Only the main branch saves caches.

inputs:
  unique-cache-name:
    description: Unique disk-cache name for this workflow job and matrix configuration.
    required: true
  main-branch:
    description: Branch allowed to save caches.
    required: false
    default: main
  skip-disk-cache-restore:
    description: Skip the disk-cache restore. Use auto to rebuild it on main when MODULE.bazel.lock changed.
    required: false
    default: ""
  skip-repository-cache-restore:
    description: Skip the repository-cache restore.
    required: false
    default: ""
  skip-cache-restore:
    description: "Deprecated: global restore mode. Use the cache-specific restore inputs instead."
    required: false
    default: ""

  # Internal integration controls; not part of the stable public API.
  _bazelisk-cache:
    description: Enable the Bazelisk download cache.
    required: false
    default: "true"
  _repository-cache:
    description: Enable the Bazel repository cache.
    required: false
    default: "true"
  _cache-optimized:
    description: Use timestamp generations for the disk cache.
    required: false
    default: "true"
  _external-cache:
    description: Configure large external-repository caches.
    required: false
    default: "false"

outputs:
  skip-disk-cache-restore:
    description: Resolved disk-cache restore decision.
    value: ${{ steps.restore-policy.outputs.skip-disk-cache-restore }}
  skip-repository-cache-restore:
    description: Resolved repository-cache restore decision.
    value: ${{ steps.restore-policy.outputs.skip-repository-cache-restore }}
  checkout-history:
    description: "How history for automatic detection was obtained: skipped, existing, or deepened."
    value: ${{ steps.ensure-history.outputs.method }}
  lock-file-changed:
    description: "Whether MODULE.bazel.lock changed: true, false, or unknown."
    value: ${{ steps.lock-file-change-result.outputs.changed }}

runs:
  using: composite
  steps:
    - id: input-policy
      name: Validate setup and resolve input policy
      shell: bash
      env:
        CACHE_SAVE: ${{ github.ref == format('refs/heads/{0}', inputs.main-branch) }}
        LEGACY_RESTORE: ${{ inputs.skip-cache-restore }}
        DISK_RESTORE: ${{ inputs.skip-disk-cache-restore }}
        REPOSITORY_RESTORE: ${{ inputs.skip-repository-cache-restore }}
      run: |
        set -euo pipefail

        if [[ "$RUNNER_OS" != "Linux" ]]; then
          echo "setup-bazel-cache supports Linux runners only, not '$RUNNER_OS'." >&2
          exit 1
        fi
        if [[ -e "$HOME/.bazelrc" ]]; then
          echo "$HOME/.bazelrc already exists. setup-bazel-cache requires exclusive ownership of this file." >&2
          exit 1
        fi
        if [[ -n "$LEGACY_RESTORE" && ( -n "$DISK_RESTORE" || -n "$REPOSITORY_RESTORE" ) ]]; then
          echo "Deprecated input 'skip-cache-restore' cannot be combined with cache-specific restore inputs." >&2
          exit 1
        fi

        if [[ -n "$LEGACY_RESTORE" ]]; then
          case "$LEGACY_RESTORE" in true|false|auto) ;; *) exit 1 ;; esac
          echo "::warning::Input 'skip-cache-restore' is deprecated and will be removed in the next breaking release."
          disk_mode="$LEGACY_RESTORE"
          repository_mode="$LEGACY_RESTORE"
          legacy_mode="$LEGACY_RESTORE"
        else
          disk_mode="${DISK_RESTORE:-auto}"
          repository_mode="${REPOSITORY_RESTORE:-false}"
          legacy_mode=false
          case "$disk_mode" in true|false|auto) ;; *) exit 1 ;; esac
          case "$repository_mode" in true|false) ;; *) exit 1 ;; esac
        fi

        echo "cache-save=$CACHE_SAVE" >> "$GITHUB_OUTPUT"
        echo "disk-mode=$disk_mode" >> "$GITHUB_OUTPUT"
        echo "repository-mode=$repository_mode" >> "$GITHUB_OUTPUT"
        echo "legacy-mode=$legacy_mode" >> "$GITHUB_OUTPUT"
        if [[ "$CACHE_SAVE" == true && ( "$disk_mode" == auto || "$legacy_mode" == auto ) ]]; then
          echo "check-lock-file=true" >> "$GITHUB_OUTPUT"
        else
          echo "check-lock-file=false" >> "$GITHUB_OUTPUT"
        fi

    - id: ensure-history
      name: Ensure history for automatic disk-cache restore
      shell: bash
      env:
        CHECK_LOCK_FILE: ${{ steps.input-policy.outputs.check-lock-file }}
      run: |
        set -euo pipefail
        if [[ "$CHECK_LOCK_FILE" != true ]]; then
          echo "method=skipped" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "Automatic restore detection needs a repository checkout." >&2
          exit 1
        fi
        if git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD^ >/dev/null 2>&1; then
          echo "method=existing" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if GIT_TERMINAL_PROMPT=0 git -C "$GITHUB_WORKSPACE" fetch --no-tags --deepen=1 origin >/dev/null 2>&1 && \
          git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD^ >/dev/null 2>&1; then
          echo "method=deepened" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "Could not obtain HEAD^. Use actions/checkout with fetch-depth: 2 or select an explicit restore mode." >&2
        exit 1

    - id: changed-lock-file
      if: ${{ steps.input-policy.outputs.check-lock-file == 'true' }}
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        files: MODULE.bazel.lock

    - id: lock-file-change-result
      name: Resolve lock-file change result
      shell: bash
      env:
        CHECK_LOCK_FILE: ${{ steps.input-policy.outputs.check-lock-file }}
        LOCK_FILE_CHANGED: ${{ steps.changed-lock-file.outputs.any_modified }}
      run: |
        set -euo pipefail
        if [[ "$CHECK_LOCK_FILE" != true ]]; then
          echo "changed=unknown" >> "$GITHUB_OUTPUT"
        elif [[ "$LOCK_FILE_CHANGED" == true || "$LOCK_FILE_CHANGED" == false ]]; then
          echo "changed=$LOCK_FILE_CHANGED" >> "$GITHUB_OUTPUT"
        else
          echo "Unexpected lock-file change result: '$LOCK_FILE_CHANGED'." >&2
          exit 1
        fi

    - id: restore-policy
      name: Resolve cache restore decisions
      shell: bash
      env:
        CACHE_SAVE: ${{ steps.input-policy.outputs.cache-save }}
        DISK_MODE: ${{ steps.input-policy.outputs.disk-mode }}
        REPOSITORY_MODE: ${{ steps.input-policy.outputs.repository-mode }}
        LEGACY_MODE: ${{ steps.input-policy.outputs.legacy-mode }}
        LOCK_FILE_CHANGED: ${{ steps.lock-file-change-result.outputs.changed }}
      run: |
        set -euo pipefail
        resolve_mode() {
          [[ "$1" == true || ( "$1" == auto && "$CACHE_SAVE" == true && "$LOCK_FILE_CHANGED" == true ) ]]
        }
        if resolve_mode "$DISK_MODE"; then disk=true; else disk=false; fi
        if resolve_mode "$REPOSITORY_MODE"; then repository=true; else repository=false; fi
        if resolve_mode "$LEGACY_MODE"; then global=true; else global=false; fi
        echo "skip-disk-cache-restore=$disk" >> "$GITHUB_OUTPUT"
        echo "skip-repository-cache-restore=$repository" >> "$GITHUB_OUTPUT"
        echo "skip-all-cache-restore=$global" >> "$GITHUB_OUTPUT"

    # Composite actions resolve local `uses` paths against the caller workspace.
    # Expose the bundled action there so published and local invocations behave alike.
    - name: Link internal setup action
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: ln -s "$ACTION_PATH/setup-bazel" "$GITHUB_WORKSPACE/.setup-bazel-cache-internal"

    - name: Configure Bazel and caches
      uses: ./.setup-bazel-cache-internal
      with:
        disk-cache: ${{ inputs.unique-cache-name }}
        cache-save: ${{ steps.input-policy.outputs.cache-save }}
        bazelisk-cache: ${{ inputs._bazelisk-cache }}
        repository-cache: ${{ inputs._repository-cache }}
        cache-optimized: ${{ inputs._cache-optimized }}
        external-cache: ${{ inputs._external-cache }}
        skip-cache-restore: ${{ steps.restore-policy.outputs.skip-all-cache-restore }}
        skip-disk-cache-restore: ${{ steps.restore-policy.outputs.skip-disk-cache-restore }}
        skip-repository-cache-restore: ${{ steps.restore-policy.outputs.skip-repository-cache-restore }}
