name: Repository cache check
description: Check if Bazel repository cache inputs changed and save existing cache IDs.

inputs: {}

outputs:
  should_refresh_cache:
    description: Whether the repository cache should be refreshed.
    value: ${{ steps.check.outputs.should_refresh_cache }}
  old-caches-json:
    description: JSON string containing the list of existing cache IDs.
    value: ${{ steps.list-caches.outputs.old-caches-json }}

runs:
  using: composite
  steps:
    - name: Check if Bazel repository cache inputs changed
      id: check
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail

        ensure_commit_available() {
          local sha="$1"
          local fetch_ref="$2"

          if git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            return 0
          fi

          echo "Fetching missing commit $sha from $fetch_ref"
          git fetch --no-tags --depth=1 origin "$fetch_ref" >/dev/null 2>&1
          git cat-file -e "${sha}^{commit}" 2>/dev/null
        }

        if [ "$EVENT_NAME" = "push" ]; then
          base_sha="${{ github.event.before }}"
          current_sha="${{ github.sha }}"
          base_fetch_ref="$base_sha"
          current_fetch_ref="${{ github.ref }}"
        elif [ "$EVENT_NAME" = "pull_request" ]; then
          base_sha="${{ github.event.pull_request.base.sha }}"
          current_sha="${{ github.sha }}"
          base_fetch_ref="${{ github.event.pull_request.base.ref }}"
          current_fetch_ref="${{ github.ref }}"
        elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          current_sha="${{ github.sha }}"
          current_fetch_ref="${{ github.ref }}"
          if ! base_sha="$(git rev-parse "${current_sha}^" 2>/dev/null)"; then
            echo "Fetching additional history for $current_fetch_ref to resolve the base commit"
            git fetch --no-tags --deepen=1 origin "$current_fetch_ref" >/dev/null 2>&1 || true
            if ! base_sha="$(git rev-parse "${current_sha}^" 2>/dev/null)"; then
              echo "No base commit available. Refreshing cache conservatively."
              echo "should_refresh_cache=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          base_fetch_ref="$base_sha"
        elif [ "$EVENT_NAME" = "merge_group" ]; then
          echo "No cache refreshes will be done via merge groups."
          echo "should_refresh_cache=false" >> "$GITHUB_OUTPUT"
          exit 0
        else
          echo "Unsupported event: $EVENT_NAME. Refreshing cache conservatively."
          echo "should_refresh_cache=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
          echo "No base commit available. Refreshing cache conservatively."
          echo "should_refresh_cache=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if ! ensure_commit_available "$base_sha" "$base_fetch_ref"; then
          echo "Unable to fetch base commit $base_sha. Refreshing cache conservatively."
          echo "should_refresh_cache=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if ! ensure_commit_available "$current_sha" "$current_fetch_ref"; then
          echo "Unable to fetch current commit $current_sha. Refreshing cache conservatively."
          echo "should_refresh_cache=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        changed_files="$(git diff --name-only "$base_sha" "$current_sha")"

        echo "Changed files between $base_sha and $current_sha:"
        if [ -n "$changed_files" ]; then
          printf '%s\n' "$changed_files"
        else
          echo "  (none)"
        fi

        if printf '%s\n' "$changed_files" | grep -Eq '^MODULE\.bazel'; then
          echo "Bazel repository cache inputs changed. Proceeding with cache refresh."
          echo "should_refresh_cache=true" >> "$GITHUB_OUTPUT"
        else
          echo "No Bazel repository cache inputs changed. Skipping cache deletion and recreation."
          echo "should_refresh_cache=false" >> "$GITHUB_OUTPUT"
        fi

    - name: List and save current caches
      id: list-caches
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHOULD_REFRESH: ${{ steps.check.outputs.should_refresh_cache }}
      run: |
        set -euo pipefail
        if [ "$SHOULD_REFRESH" = "true" ]; then
          caches_json=$(gh cache list --repo ${{ github.repository }} --json id)
          echo "old-caches-json=${caches_json}" >> "$GITHUB_OUTPUT"
          echo "Found $(echo "$caches_json" | jq 'length') existing caches"
        else
          echo "old-caches-json=[]" >> "$GITHUB_OUTPUT"
          echo "Cache refresh not needed, returning empty cache list"
        fi
