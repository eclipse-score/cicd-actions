name: Build Documentation
description: Builds documentation with Bazel and uploads it as the github-pages artifact.

inputs:
  retention-days:
    description: Number of days to retain the documentation artifact.
    required: false
    default: "1"
  bazel-target:
    description: Bazel target to build.
    required: false
    default: "//:docs"
  tests-report-artifact:
    description: Optional artifact to download to tests-report before building documentation.
    required: false
    default: ""
  gh-app-client-id:
    description: GitHub App client ID for inter-repository access.
    required: false
    default: ""
  gh-app-private-key:
    description: GitHub App private key for inter-repository access.
    required: false
    default: ""
  token:
    description: Token for inter-repository access.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Configure inter-repository access
      if: ${{ inputs.gh-app-private-key != '' || inputs.token != '' }}
      uses: eclipse-score/cicd-actions/inter-repo-access@212bbf86267e9381da9d2daf962d12f6feafbc90 # main branch (2026-07-24)
      with:
        token: ${{ inputs.token }}
        github-app-client-id: ${{ inputs.gh-app-client-id }}
        github-app-private-key: ${{ inputs.gh-app-private-key }}

    - name: Free disk space
      uses: eclipse-score/more-disk-space@3fac5780033e636b114cf69e891dc19d640855c2 # v1.1.0

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Bazel
      uses: eclipse-score/cicd-actions/setup-bazel-cache@212bbf86267e9381da9d2daf962d12f6feafbc90 # main branch (2026-07-24)
      with:
        unique-cache-name: ${{ github.job }}

    - name: Download test report
      if: ${{ inputs.tests-report-artifact != '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.tests-report-artifact }}
        path: tests-report

    - name: Build documentation
      shell: bash
      run: bazel run "${{ inputs.bazel-target }}"

    - name: Upload documentation artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: github-pages
        path: _build
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
