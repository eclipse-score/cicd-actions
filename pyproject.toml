[project]
name = "score-cicd-actions"
version = "0.1.0"
description = "Maintainer tooling for SCORE CI actions"
requires-python = ">=3.12"
dependencies = ["monorepo-releases"]

[tool.uv]
package = false

[tool.uv.sources]
monorepo-releases = { git = "https://github.com/eclipse-score/cicd-workflows", tag = "monorepo-releases/v0.0.0", subdirectory = "tools/monorepo-releases" }
