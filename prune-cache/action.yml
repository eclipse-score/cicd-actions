name: Prune Cache
description: Keep only the newest GitHub Actions cache generation per cache family

inputs:
  token:
    description: GitHub token used to manage Actions caches
    default: ${{ github.token }}

  dry-run:
    description: Report obsolete caches without deleting them
    default: "false"

runs:
  using: node24
  main: index.js

branding:
  icon: trash-2
  color: orange
