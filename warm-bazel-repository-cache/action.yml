name: Warm bazel repository cache
description: Validate and warm Bazel repository cache for all variants.

inputs:
  variants:
    description: |
      Newline-separated list of arguments to append to `bazel fetch`.
      Each line is split on whitespace and passed as one fetch invocation.
      Examples: `--config=x86_64-linux //...`, `//...`, `//test //quality`.
    required: true
  dry-run:
    description: |
      When set to true, only validates `variants` and does not run `bazel fetch`.
      Accepted values are `true` and `false`.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate variants input
      shell: bash
      env:
        VARIANTS_INPUT: ${{ inputs.variants }}
      run: |
        set -euo pipefail

        mapfile -t bazelrc_files < <(find . -type f \( -name '.bazelrc' -o -name '*.bazelrc' -o -name '.bazelrc.*' \))
        if [[ ${#bazelrc_files[@]} -eq 0 ]]; then
          echo "no .bazelrc files were found for validation" >&2
          exit 1
        fi

        line_no=0
        while IFS= read -r variant_line || [[ -n "$variant_line" ]]; do
          line_no=$((line_no + 1))

          if [[ -z "${variant_line//[[:space:]]/}" ]]; then
            continue
          fi

          read -r -a tokens <<< "$variant_line"

          config_arg=""
          config_count=0
          targets=()

          for token in "${tokens[@]}"; do
            if [[ "$token" == --config=* ]]; then
              config_arg="$token"
              config_count=$((config_count + 1))
              continue
            fi

            if [[ "$token" == --* ]]; then
              echo "Unsupported option '$token' in variants line $line_no. Only --config=<name> is supported in this workflow input." >&2
              exit 1
            fi

            targets+=("$token")
          done

          if [[ $config_count -gt 1 ]]; then
            echo "variants line $line_no contains more than one --config=... argument: $variant_line" >&2
            exit 1
          fi

          if [[ -n "$config_arg" ]]; then
            config_name="${config_arg#--config=}"
            if [[ -z "$config_name" ]]; then
              echo "variants line $line_no has an empty --config value: $variant_line" >&2
              exit 1
            fi

            escaped_config_name="$(printf '%s' "$config_name" | sed -E 's/[][\\.^$*+?(){}|]/\\\\&/g')"
            if ! grep -E -q "^[[:space:]]*(build|common|fetch|test):${escaped_config_name}([[:space:]]|$)" "${bazelrc_files[@]}"; then
              echo "Unknown --config=$config_name in variants line $line_no. No matching build/common/fetch/test stanza found in .bazelrc files." >&2
              exit 1
            fi
          fi

          if [[ ${#targets[@]} -eq 0 ]]; then
            echo "variants line $line_no does not contain a target: $variant_line" >&2
            exit 1
          fi

          for target in "${targets[@]}"; do
            bazel query "$target" >/dev/null
          done
        done <<< "$VARIANTS_INPUT"

    - name: Warm Bazel repository cache for all variants (with retries)
      shell: bash
      if: ${{ inputs.dry-run != 'true' }}
      env:
        VARIANTS_INPUT: ${{ inputs.variants }}
      run: |
        set -euo pipefail

        mapfile -t variants < <(printf '%s\n' "$VARIANTS_INPUT" | sed '/^[[:space:]]*$/d')
        if [ "${#variants[@]}" -eq 0 ]; then
          echo "No variants were provided."
          exit 1
        fi

        max_attempts=10
        failed_variants=()

        for variant in "${variants[@]}"; do
          read -r -a fetch_args <<< "$variant"
          if [[ "${#fetch_args[@]}" -eq 0 ]]; then
            echo "Skipping empty bazel fetch arguments entry"
            continue
          fi

          success=false

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Running bazel fetch ${variant} (attempt ${attempt}/${max_attempts})"
            bazel_fetch_cmd=(bazel fetch)

            if "${bazel_fetch_cmd[@]}" "${fetch_args[@]}"; then
              echo "Successfully fetched dependencies for arguments '${variant}'"
              success=true
              break
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              backoff_seconds=$((attempt * 20))
              echo "bazel fetch failed (likely transient). Retrying in ${backoff_seconds}s..."
              sleep "$backoff_seconds"
            fi
          done

          if [ "$success" != "true" ]; then
            echo "bazel fetch failed for arguments '${variant}' after ${max_attempts} attempts"
            failed_variants+=("${variant}")
          fi
        done

        if [ "${#failed_variants[@]}" -ne 0 ]; then
          echo "Bazel fetch failed for the following variants:"
          for variant in "${failed_variants[@]}"; do
            echo "  - ${variant}"
          done
          exit 1
        fi
