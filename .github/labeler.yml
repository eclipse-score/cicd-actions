# Share component paths between PR labels and the release overview.
# Include manifests, source files and distribution bundles for each action.
inter-repo-access:
  - changed-files:
      - any-glob-to-any-file:
          - "inter-repo-access/**"

setup-qnx-sdp:
  - changed-files:
      - any-glob-to-any-file:
          - "setup-qnx-sdp/**"

setup-bazel-cache:
  - changed-files:
      - any-glob-to-any-file:
          - "setup-bazel-cache/**"

unblock-user-namespace-for-linux-sandbox:
  - changed-files:
      - any-glob-to-any-file:
          - "unblock-user-namespace-for-linux-sandbox/**"

prune-cache:
  - changed-files:
      - any-glob-to-any-file:
          - "prune-cache/**"

warm-bazel-repository-cache:
  - changed-files:
      - any-glob-to-any-file:
          - "warm-bazel-repository-cache/**"
