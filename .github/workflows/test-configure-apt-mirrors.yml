name: Test Configure APT Mirrors

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-apt-mirrors:
    name: Configure mirrors and install Graphviz
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure APT mirrors
        uses: ./configure-apt-mirrors

      - name: Verify APT mirror configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'URIs: mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          sudo -u _apt test -r /etc/apt/apt-mirrors.txt
          grep -Fq $'https://mirror.pilotfiber.com/ubuntu/\tpriority:1' /etc/apt/apt-mirrors.txt
          grep -Fq $'http://mirror.arizona.edu/ubuntu/\tpriority:2' /etc/apt/apt-mirrors.txt
          apt-config dump | grep -F 'Acquire::Retries "3";'

      - name: Update package lists and install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz
