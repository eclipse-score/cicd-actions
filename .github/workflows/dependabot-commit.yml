name: Commit Dependabot distributions

on:
  workflow_run:
    workflows: [Build Dependabot distributions]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  commit:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only execute the publisher from the default branch. Neither PR code nor
      # downloaded artifacts may execute with the bot's write-capable PAT.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check whether the build belongs to a current Dependabot PR
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/dependabot_dist.py eligible
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.eligibility.outputs.publish == 'true'
        with:
          name: dependabot-distributions
          path: ${{ runner.temp }}/dependabot-distributions
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Commit validated distributions to the current PR head
        if: steps.eligibility.outputs.publish == 'true'
        env:
          # A PAT makes the added commit trigger the normal PR checks. The
          # built-in GITHUB_TOKEN would require manual workflow approval.
          GH_TOKEN: ${{ secrets.SCORE_BOT_CLASSIC_PAT }}
          DISTRIBUTION_PAYLOAD: ${{ runner.temp }}/dependabot-distributions/dependabot-distributions.json
        run: python3 -B .github/scripts/dependabot_dist.py publish
