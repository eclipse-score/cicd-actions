name: PR
on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

# Cancel superseded runs of the same ref. The cache self-tests prune Actions
# caches repo-wide but scoped to the run's ref, so two concurrent runs on the
# same ref (e.g. rapid pushes to a PR) would prune each other's caches and flake.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common:
    uses: eclipse-score/cicd-workflows/.github/workflows/on-pr.yml@v0.0.1
    permissions:
      id-token: write
      contents: read

  inter-repo-access-tests:
    uses: ./.github/workflows/test-inter-repo-access.yml
    permissions:
      contents: read

  setup-qnx-sdp-tests:
    uses: ./.github/workflows/test-setup-qnx-sdp.yml
    permissions:
      contents: read

  setup-bazel-cache-tests:
    uses: ./.github/workflows/test-setup-bazel-cache.yml
    permissions:
      actions: write
      contents: read

  unblock-user-namespace-for-linux-sandbox-tests:
    uses: ./.github/workflows/test-unblock-user-namespace-for-linux-sandbox.yml
    permissions:
      contents: read

  prune-cache-tests:
    uses: ./.github/workflows/test-prune-cache.yml
    permissions:
      actions: write
      contents: read
