name: PR
on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

# Cancel superseded runs of the same ref. The cache self-tests prune Actions
# caches repo-wide but scoped to the run's ref, so two concurrent runs on the
# same ref (e.g. rapid pushes to a PR) would prune each other's caches and flake.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common:
    uses: eclipse-score/cicd-workflows/.github/workflows/on-pr.yml@v0.0.2
    permissions:
      id-token: write
      contents: read

  inter-repo-access-tests:
    uses: ./.github/workflows/test-inter-repo-access.yml
    permissions:
      contents: read

  setup-qnx-sdp-tests:
    uses: ./.github/workflows/test-setup-qnx-sdp.yml
    permissions:
      contents: read

  setup-bazel-cache-tests:
    uses: ./.github/workflows/test-setup-bazel-cache.yml
    permissions:
      actions: write
      contents: read

  warm-bazel-repository-cache-tests:
    uses: ./.github/workflows/test-warm-bazel-repository-cache.yml
    permissions:
      actions: read
      contents: read

  unblock-user-namespace-for-linux-sandbox-tests:
    uses: ./.github/workflows/test-unblock-user-namespace-for-linux-sandbox.yml
    permissions:
      contents: read

  prune-cache-tests:
    uses: ./.github/workflows/test-prune-cache.yml
    permissions:
      actions: write
      contents: read

  # The write-capable cache self-tests can't run on fork PRs (GitHub forces a
  # read-only token), so forks get this read-only dry-run and the full suite runs
  # in the merge queue before merge, not via `pull_request_target`. The only
  # window `pull_request_target` would add is running the write tests after a
  # maintainer reviews the fork's code but before the PR is approved (the run is
  # environment-gated, so fork code never gets a write token pre-review); the
  # merge queue runs them right after approval anyway, so it buys nothing beyond a
  # per-run environment approval and an untrusted-code-with-write-token surface.
  prune-cache-dry-run-tests:
    uses: ./.github/workflows/test-prune-cache-dry-run.yml
    permissions:
      actions: read
      contents: read

  # Single aggregate gate used as a required status check for branch
  # protection and the merge queue. Requiring one stable check is more robust
  # than listing every job: individual job names change, and any required check
  # that is *skipped* (several `common` jobs are) would block the merge queue
  # forever. This job always runs and fails if any dependency failed.
  ci-success:
    name: CI success
    if: always()
    permissions: {}
    needs:
      - common
      - inter-repo-access-tests
      - setup-qnx-sdp-tests
      - unblock-user-namespace-for-linux-sandbox-tests
      - setup-bazel-cache-tests
      - warm-bazel-repository-cache-tests
      - prune-cache-tests
      - prune-cache-dry-run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required jobs failed or were cancelled."
          exit 1
