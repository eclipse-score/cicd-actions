# This workflow deliberately tests the real GitHub cache service:
#
# - A push runs in the pushed branch's cache scope. This gives same-repository
#   feature branches automatic coverage before their pull request is merged.
# - The pull-request workflow calls this workflow for merge-group runs, using
#   the temporary merge-queue ref's cache scope. This gives fork pull requests
#   write-capable coverage after approval, without allowing their code to write
#   to the default branch's caches.
# - A manual run is available only for diagnostics; normal coverage does not
#   depend on somebody remembering to dispatch it.
#
# Do not replace these triggers with pull_request_target. That event has the
# default branch's privileged context, so executing the candidate action there
# would let untrusted fork code access a sensitive token and cache scope.
#
# Saving and restoring require separate jobs because JavaScript action post
# steps run only when their job ends. A successful seed job creates a baseline.
# A second job restores that baseline and adds markers. Automatic runs keep the
# job green; manual diagnostics can opt into a real failure to exercise the
# failure-sensitive post condition. The third job proves that the disk and
# repository additions survived.

name: Test Setup Bazel Cache Persistence

on:
  workflow_call:
    inputs:
      exercise-failed-job:
        description: Intentionally fail the cache-writing job.
        type: boolean
        default: false
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/test-setup-bazel-cache-persistence.yml
      - setup-bazel-cache/**
  workflow_dispatch:
    inputs:
      exercise-failed-job:
        description: Intentionally fail the cache-writing job and publish an expected red check.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: setup-bazel-cache-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed-cache:
    name: Seed successful cache baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Create cache identity files
        shell: bash
        run: |
          set -euo pipefail
          echo 'module(name = "cache_persistence_test")' > MODULE.bazel
          echo '{"persistence":"${{ github.run_id }}-${{ github.run_attempt }}"}' > MODULE.bazel.lock
          echo "8.6.0-persistence-${{ github.run_id }}-${{ github.run_attempt }}" > .bazelversion

      - name: Configure writable branch caches
        id: setup
        uses: ./setup-bazel-cache
        with:
          disk-cache-key: persistence-${{ github.run_id }}-${{ github.run_attempt }}
          cache-save-branch-patterns: ${{ github.ref_name }}
          disk-cache-restore: "true"
          disk-cache-save: "true"
          repository-cache-restore: "true"
          repository-cache-save: "true"

      - name: Add baseline cache markers
        shell: bash
        env:
          CACHE_SAVE_ALLOWED: ${{ steps.setup.outputs.cache-save-branch-evaluated }}
          FAILED_JOB_CACHE_SAVE_ALLOWED: ${{ steps.setup.outputs._failed-job-cache-save-allowed }}
        run: |
          set -euo pipefail
          [[ "$CACHE_SAVE_ALLOWED" == "true" ]]
          [[ "$FAILED_JOB_CACHE_SAVE_ALLOWED" == "false" ]]

          marker="baseline-${{ github.run_id }}-${{ github.run_attempt }}"
          for cache in bazelisk bazel-disk bazel-repo; do
            mkdir -p "${HOME}/.cache/${cache}"
            echo "$marker" > "${HOME}/.cache/${cache}/${marker}"
          done

  save-additions-after-failure:
    name: Save additive cache entries
    needs: seed-cache
    continue-on-error: ${{ inputs.exercise-failed-job }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Create cache identity files
        shell: bash
        run: |
          set -euo pipefail
          echo 'module(name = "cache_persistence_test")' > MODULE.bazel
          echo '{"persistence":"${{ github.run_id }}-${{ github.run_attempt }}"}' > MODULE.bazel.lock
          echo "8.6.0-persistence-${{ github.run_id }}-${{ github.run_attempt }}" > .bazelversion

      - name: Restore seeded caches
        id: restore
        uses: ./setup-bazel-cache
        with:
          disk-cache-key: persistence-${{ github.run_id }}-${{ github.run_attempt }}
          cache-save-branch-patterns: ${{ github.ref_name }}
          disk-cache-restore: "true"
          disk-cache-save: "true"
          repository-cache-restore: "true"
          repository-cache-save: "true"

      - name: Verify additive restore and add markers
        shell: bash
        env:
          BAZELISK_RESTORE: ${{ steps.restore.outputs.bazelisk-cache-restored }}
          DISK_RESTORE: ${{ steps.restore.outputs.disk-cache-restored }}
          FAILED_JOB_CACHE_SAVE_ALLOWED: ${{ steps.restore.outputs._failed-job-cache-save-allowed }}
          REPOSITORY_RESTORE: ${{ steps.restore.outputs.repository-cache-restored }}
        run: |
          set -euo pipefail
          [[ "$BAZELISK_RESTORE" == "true" ]]
          [[ "$DISK_RESTORE" == "true" ]]
          [[ "$REPOSITORY_RESTORE" == "true" ]]
          [[ "$FAILED_JOB_CACHE_SAVE_ALLOWED" == "true" ]]

          marker="baseline-${{ github.run_id }}-${{ github.run_attempt }}"
          for cache in bazelisk bazel-disk bazel-repo; do
            test "$(cat "${HOME}/.cache/${cache}/${marker}")" = "$marker"
          done

          marker="addition-${{ github.run_id }}-${{ github.run_attempt }}"
          for cache in bazel-disk bazel-repo; do
            echo "$marker" > "${HOME}/.cache/${cache}/${marker}"
          done

      - name: Fail after adding to restored caches
        if: inputs.exercise-failed-job
        shell: bash
        run: exit 1

  restore-failed-job-additions:
    name: Restore saved additive entries
    if: always()
    needs: save-additions-after-failure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Create cache identity files
        shell: bash
        run: |
          set -euo pipefail
          echo 'module(name = "cache_persistence_test")' > MODULE.bazel
          echo '{"persistence":"${{ github.run_id }}-${{ github.run_attempt }}"}' > MODULE.bazel.lock
          echo "8.6.0-persistence-${{ github.run_id }}-${{ github.run_attempt }}" > .bazelversion

      - name: Restore caches extended by the failed job
        id: restore
        uses: ./setup-bazel-cache
        with:
          disk-cache-key: persistence-${{ github.run_id }}-${{ github.run_attempt }}
          cache-save-branch-patterns: ${{ github.ref_name }}
          disk-cache-restore: "true"
          disk-cache-save: "true"
          repository-cache-restore: "true"
          repository-cache-save: "true"

      - name: Verify failed-job additions
        shell: bash
        env:
          BAZELISK_RESTORE: ${{ steps.restore.outputs.bazelisk-cache-restored }}
          DISK_RESTORE: ${{ steps.restore.outputs.disk-cache-restored }}
          REPOSITORY_RESTORE: ${{ steps.restore.outputs.repository-cache-restored }}
        run: |
          set -euo pipefail
          [[ "$BAZELISK_RESTORE" == "true" ]]
          [[ "$DISK_RESTORE" == "true" ]]
          [[ "$REPOSITORY_RESTORE" == "true" ]]

          marker="addition-${{ github.run_id }}-${{ github.run_attempt }}"
          for cache in bazel-disk bazel-repo; do
            test "$(cat "${HOME}/.cache/${cache}/${marker}")" = "$marker"
          done
