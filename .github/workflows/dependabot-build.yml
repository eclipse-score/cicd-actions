name: Build Dependabot distributions

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - setup-bazel-cache/package.json
      - setup-bazel-cache/package-lock.json
      - setup-qnx-sdp/package.json
      - setup-qnx-sdp/package-lock.json

permissions:
  contents: read

concurrency:
  group: dependabot-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Build exactly the PR head, not the synthetic merge commit. The publisher
      # checks this SHA again before adding a commit to the Dependabot branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
      - name: Pin npm to the pre-commit build version
        run: npm install --global npm@11.12.1
      - name: Test and build the action distributions
        # No PAT or repository secrets are exposed to dependency install scripts,
        # tests, or bundlers. The publisher runs on a separate, fresh runner.
        run: |
          for action in setup-bazel-cache setup-qnx-sdp; do
            (
              cd "$action"
              npm ci
              npm run lint
              npm run test --if-present
              npm run build
            )
          done
      - name: Package distribution changes
        env:
          DISTRIBUTION_PAYLOAD: ${{ runner.temp }}/dependabot-distributions.json
        run: python3 -B .github/scripts/dependabot_dist.py package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependabot-distributions
          path: ${{ runner.temp }}/dependabot-distributions.json
          if-no-files-found: error
          retention-days: 1
