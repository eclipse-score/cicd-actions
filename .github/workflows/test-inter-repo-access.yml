name: Test Inter-Repo Access

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # GitHub App mode is supported by inter-repo-access, but not self-tested here
  # because this repository/org does not have a configured test App installation.
  github-token-mode:
    name: Self-test github.token mode
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Seed stale token rewrites
        shell: bash
        env:
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          server_url="${SERVER_URL%/}"
          host="${server_url#https://}"
          for old_token in expired-one expired-two; do
            old_key="url.https://x-access-token:${old_token}@${host}/.insteadOf"
            git config --global --add "$old_key" "${server_url}/"
            git config --global --add "$old_key" "git@${host}:"
            git config --global --add "$old_key" "ssh://git@${host}/"
            git config --global --add "$old_key" "${server_url}/rewrite-probe/"
          done
          git config --global "url.https://x-access-token:other-token@other.invalid/.insteadOf" "https://other.invalid/"

      - name: Configure inter-repo access
        id: access
        uses: ./inter-repo-access

      - name: Configure inter-repo access again
        uses: ./inter-repo-access

      - name: Checkout probe repository without explicit token
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          path: checkout-probe
          persist-credentials: false

      - name: Verify configured access
        shell: bash
        env:
          EXPECTED_MODE: github-token
          ACTUAL_MODE: ${{ steps.access.outputs.mode }}
          SELECTED_TOKEN: ${{ steps.access.outputs.token }}
          SERVER_URL: ${{ github.server_url }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$ACTUAL_MODE" != "$EXPECTED_MODE" ]]; then
            echo "Expected mode '$EXPECTED_MODE' but got '$ACTUAL_MODE'."
            exit 1
          fi

          if [[ -z "$SELECTED_TOKEN" ]]; then
            echo "Expected a non-empty selected token output."
            exit 1
          fi

          server_url="${SERVER_URL%/}"
          host="${server_url#https://}"
          token_url="https://x-access-token:${SELECTED_TOKEN}@${host}/"
          for prefix in "${server_url}/" "git@${host}:" "ssh://git@${host}/"; do
            actual_url="$(git ls-remote --get-url "${prefix}rewrite-probe/repo.git")"
            if [[ "$actual_url" != "${token_url}rewrite-probe/repo.git" ]]; then
              echo "Git URL rewrite did not select the current token."
              exit 1
            fi
          done
          for old_token in expired-one expired-two; do
            if git config --global --get-all "url.https://x-access-token:${old_token}@${host}/.insteadOf" >/dev/null; then
              echo "Stale token rewrite is still configured."
              exit 1
            fi
          done
          rewrite_count="$(git config --global --get-all "url.${token_url}.insteadOf" | wc -l)"
          [[ "$rewrite_count" -eq 3 ]]
          [[ "$(git config --global --get-all "url.https://x-access-token:other-token@other.invalid/.insteadOf")" == "https://other.invalid/" ]]

          if git config --local --get-all "http.${SERVER_URL}/.extraheader" >/dev/null; then
            echo "actions/checkout extraheader is still configured in the workspace repo."
            exit 1
          fi

          if git -C "$GITHUB_WORKSPACE/checkout-probe" config --local --get-all "http.${SERVER_URL}/.extraheader" >/dev/null; then
            echo "actions/checkout extraheader is configured in checkout-probe despite persist-credentials=false."
            exit 1
          fi

          git config --global --get-all safe.directory | grep -Fx "$GITHUB_WORKSPACE" >/dev/null

          git clone --depth 1 "https://github.com/${TARGET_REPOSITORY}.git" clone-https >/dev/null
          git clone --depth 1 "git@github.com:${TARGET_REPOSITORY}.git" clone-ssh >/dev/null

  token-mode:
    name: Self-test token mode
    # Secrets are only available for this manual path; workflow_call covers github.token mode.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Ensure token is configured
        shell: bash
        env:
          DIRECT_TOKEN: ${{ secrets.SCORE_BOT_CLASSIC_PAT }}
        run: |
          set -euo pipefail

          if [[ -z "$DIRECT_TOKEN" ]]; then
            echo "Repository secret SCORE_BOT_CLASSIC_PAT is required for this test."
            exit 1
          fi

      - name: Configure inter-repo access
        id: access
        uses: ./inter-repo-access
        with:
          token: ${{ secrets.SCORE_BOT_CLASSIC_PAT }}

      - name: Checkout probe repository without explicit token
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          path: checkout-probe
          persist-credentials: false

      - name: Verify configured access
        shell: bash
        env:
          EXPECTED_MODE: token
          ACTUAL_MODE: ${{ steps.access.outputs.mode }}
          SELECTED_TOKEN: ${{ steps.access.outputs.token }}
          SERVER_URL: ${{ github.server_url }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$ACTUAL_MODE" != "$EXPECTED_MODE" ]]; then
            echo "Expected mode '$EXPECTED_MODE' but got '$ACTUAL_MODE'."
            exit 1
          fi

          if [[ -z "$SELECTED_TOKEN" ]]; then
            echo "Expected a non-empty selected token output."
            exit 1
          fi

          if git config --local --get-all "http.${SERVER_URL}/.extraheader" >/dev/null; then
            echo "actions/checkout extraheader is still configured in the workspace repo."
            exit 1
          fi

          if git -C "$GITHUB_WORKSPACE/checkout-probe" config --local --get-all "http.${SERVER_URL}/.extraheader" >/dev/null; then
            echo "actions/checkout extraheader is configured in checkout-probe despite persist-credentials=false."
            exit 1
          fi

          git config --global --get-all safe.directory | grep -Fx "$GITHUB_WORKSPACE" >/dev/null

          git clone --depth 1 "https://github.com/${TARGET_REPOSITORY}.git" clone-https >/dev/null
          git clone --depth 1 "git@github.com:${TARGET_REPOSITORY}.git" clone-ssh >/dev/null
