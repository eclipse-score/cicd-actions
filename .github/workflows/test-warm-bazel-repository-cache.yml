name: Test Repository Cache Refresh

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valid-variants-dry-run:
    name: Valid variants pass dry-run validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Stage Bazel fixture in workspace root
        shell: bash
        run: |
          set -euo pipefail
          mv resources/bazel_fixture/* "${GITHUB_WORKSPACE}/"
          mv resources/bazel_fixture/.* "${GITHUB_WORKSPACE}/"

      - name: Run action in dry-run mode with valid variants
        uses: ./warm-bazel-repository-cache
        with:
          dry-run: true
          variants: |
            //:enabled
            --config=ci //:enabled
            --config=linux //:enabled

  rejects-unknown-config:
    name: Unknown config fails dry-run validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Stage Bazel fixture in workspace root
        shell: bash
        run: |
          set -euo pipefail
          mv resources/bazel_fixture/* "${GITHUB_WORKSPACE}/"
          mv resources/bazel_fixture/.* "${GITHUB_WORKSPACE}/"

      - name: Run action in dry-run mode with unknown config
        id: validation
        continue-on-error: true
        uses: ./warm-bazel-repository-cache
        with:
          dry-run: true
          variants: |
            --config=missing //:enabled

      - name: Assert validation failed
        shell: bash
        env:
          OUTCOME: ${{ steps.validation.outcome }}
        run: |
          set -euo pipefail

          if [[ "$OUTCOME" != "failure" ]]; then
            echo "Expected unknown config validation to fail, got: $OUTCOME"
            exit 1
          fi

  invalid-input-skips-fetch:
    name: Invalid input skips fetch
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Stage Bazel fixture in workspace root
        shell: bash
        run: |
          set -euo pipefail
          mv resources/bazel_fixture/* "${GITHUB_WORKSPACE}/"
          mv resources/bazel_fixture/.* "${GITHUB_WORKSPACE}/"

      - name: Run action without dry-run mode with unknown config
        id: validation
        continue-on-error: true
        uses: ./warm-bazel-repository-cache
        with:
          dry-run: false
          variants: |
            --config=missing //:enabled

      - name: Assert validation failed
        shell: bash
        env:
          OUTCOME: ${{ steps.validation.outcome }}
        run: |
          set -euo pipefail

          if [[ "$OUTCOME" != "failure" ]]; then
            echo "Expected unknown config validation to fail, got: $OUTCOME"
            exit 1
          fi

  rejects-unsupported-option:
    name: Unsupported option fails dry-run validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Stage Bazel fixture in workspace root
        shell: bash
        run: |
          set -euo pipefail
          mv resources/bazel_fixture/* "${GITHUB_WORKSPACE}/"
          mv resources/bazel_fixture/.* "${GITHUB_WORKSPACE}/"

      - name: Run action in dry-run mode with unsupported option
        id: validation
        continue-on-error: true
        uses: ./warm-bazel-repository-cache
        with:
          dry-run: true
          variants: |
            --config=ci --keep_going //:enabled

      - name: Assert validation failed
        shell: bash
        env:
          OUTCOME: ${{ steps.validation.outcome }}
        run: |
          set -euo pipefail

          if [[ "$OUTCOME" != "failure" ]]; then
            echo "Expected unsupported option validation to fail, got: $OUTCOME"
            exit 1
          fi

  rejects-unknown-target:
    name: Unknown target fails dry-run validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Stage Bazel fixture in workspace root
        shell: bash
        run: |
          set -euo pipefail
          mv resources/bazel_fixture/* "${GITHUB_WORKSPACE}/"
          mv resources/bazel_fixture/.* "${GITHUB_WORKSPACE}/"

      - name: Run action in dry-run mode with unknown target
        id: validation
        continue-on-error: true
        uses: ./warm-bazel-repository-cache
        with:
          dry-run: true
          variants: |
            --config=ci //:missing

      - name: Assert validation failed
        shell: bash
        env:
          OUTCOME: ${{ steps.validation.outcome }}
        run: |
          set -euo pipefail

          if [[ "$OUTCOME" != "failure" ]]; then
            echo "Expected unknown target validation to fail, got: $OUTCOME"
            exit 1
          fi

  warm-bazel-repository-cache:
    name: Repository cache is warmed
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Stage Bazel fixture in workspace root
        shell: bash
        run: |
          set -euo pipefail
          mv resources/bazel_fixture/* "${GITHUB_WORKSPACE}/"
          mv resources/bazel_fixture/.* "${GITHUB_WORKSPACE}/"

      - name: Configure Bazel with repository cache enabled
        uses: ./setup-bazel-cache
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}-refresh

      - name: Clear repository cache before action
        shell: bash
        run: |
          set -euo pipefail

          repository_cache_dir="$(bazel info repository_cache)"
          if [[ ! -d "${repository_cache_dir}" ]]; then
            echo "INFO: repository cache directory does not exist: ${repository_cache_dir}"
            exit 0
          fi

          find "${repository_cache_dir}" -mindepth 1 -delete
          if find "${repository_cache_dir}" -mindepth 1 -print -quit | grep -q .; then
            echo "ERROR: repository cache directory was not cleared"
            exit 1
          fi

      - name: Run warm-bazel-repository-cache action with cache deletion disabled
        uses: ./warm-bazel-repository-cache
        with:
          variants: |
            --config=ci //:enabled
            //:enabled

      - name: Verify repository cache was warmed
        shell: bash
        run: |
          set -euo pipefail

          repository_cache_dir="$(bazel info repository_cache)"
          if ! find "${repository_cache_dir}" -type f -print -quit | grep -q .; then
            echo "ERROR: repository cache is still empty after warm-bazel-repository-cache ran"
            exit 1
          fi

          echo "Repository cache warmed at ${repository_cache_dir}"
