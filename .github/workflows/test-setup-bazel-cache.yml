# Self-test for the setup-bazel-cache action, which declares `actions: write`.
# The job below guards itself to write-capable contexts (same-repository pull
# requests, the merge queue, and manual workflow_dispatch); fork pull requests
# get a read-only token and are covered by the merge queue before merge.

name: Test Setup Bazel Cache

on:
  workflow_call:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  setup-bazel-cache:
    name: Action runs without error
    # Needs a write-capable token, which forks do not get. See the file header.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Plain checkout resolves the code under test for both same-repo
      # `pull_request` and `merge_group`. See the note in test-prune-cache.yml.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Create minimal Bazel workspace
        shell: bash
        run: |
          set -euo pipefail
          echo 'module(name = "cache_test")' > "${GITHUB_WORKSPACE}/MODULE.bazel"
          echo '8.6.0' > "${GITHUB_WORKSPACE}/.bazelversion"

      - name: Verify ~/.bazelrc does not exist before action
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "${HOME}/.bazelrc" ]]; then
            echo "ERROR: ~/.bazelrc already exists before setup-bazel-cache ran"
            exit 1
          fi

      - name: Run setup-bazel-cache action
        uses: ./setup-bazel-cache
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}

      - name: Verify ~/.bazelrc was written by action with cache configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${HOME}/.bazelrc" ]]; then
            echo "ERROR: ~/.bazelrc was not created by setup-bazel-cache"
            exit 1
          fi

          if ! grep -Fq -- "--disk_cache=" "${HOME}/.bazelrc"; then
            echo "ERROR: ~/.bazelrc does not contain disk_cache configuration"
            exit 1
          fi

          if ! grep -Fq -- "--repository_cache=" "${HOME}/.bazelrc"; then
            echo "ERROR: ~/.bazelrc does not contain repository_cache configuration"
            exit 1
          fi

          echo "~/.bazelrc contents:"
          cat "${HOME}/.bazelrc"

      - name: Run bazel info to verify workspace and cache configuration are valid
        shell: bash
        run: bazel info --announce_rc
