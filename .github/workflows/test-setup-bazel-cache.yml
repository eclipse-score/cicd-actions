# Self-tests for setup-bazel-cache. The separate
# persistence workflow exercises cache writes automatically on branch pushes.

name: Test Setup Bazel Cache

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  auto-refuses-unavailable-history:
    name: Auto mode requires checkout history
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out action source with shallow history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Make history deepening unavailable
        shell: bash
        run: |
          git remote remove origin

      - name: Run auto mode
        id: setup-bazel-cache
        continue-on-error: true
        uses: ./setup-bazel-cache
        with:
          disk-cache-key: ${{ github.workflow }}-${{ github.job }}

      - name: Verify auto mode refused unavailable history
        shell: bash
        run: |
          if [[ "${{ steps.setup-bazel-cache.outcome }}" != "failure" ]]; then
            echo "ERROR: setup-bazel-cache succeeded despite unavailable history"
            exit 1
          fi

  auto-reuses-or-deepens-history:
    name: Auto mode resolves history
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fetch-depth: 2
            history-method: existing
          - fetch-depth: 1
            history-method: fetched
    steps:
      - name: Check out action source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch-depth }}

      - name: Run auto mode
        id: setup-bazel-cache
        uses: ./setup-bazel-cache
        with:
          disk-cache-key: ${{ github.workflow }}-${{ github.job }}-${{ matrix.history-method }}

      - name: Verify history was ${{ matrix.history-method }}
        shell: bash
        run: |
          if [[ "${{ steps.setup-bazel-cache.outcome }}" != "success" ]]; then
            echo "ERROR: setup-bazel-cache failed"
            exit 1
          fi
          if [[ "${{ steps.setup-bazel-cache.outputs._checkout-history }}" != "${{ matrix.history-method }}" ]]; then
            echo "ERROR: expected '${{ matrix.history-method }}', got '${{ steps.setup-bazel-cache.outputs._checkout-history }}'"
            exit 1
          fi
          case "${{ steps.setup-bazel-cache.outputs._lock-file-changed }}" in
            true|false) ;;
            *)
              echo "ERROR: expected a lockfile change result, got '${{ steps.setup-bazel-cache.outputs._lock-file-changed }}'"
              exit 1
              ;;
          esac

  auto-requires-git-checkout:
    name: Auto mode requires a Git checkout
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out action source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Remove checkout metadata
        shell: bash
        run: |
          mv "$GITHUB_WORKSPACE/.git" "$RUNNER_TEMP/setup-bazel-cache-test.git"

      - name: Run auto mode
        id: setup-bazel-cache
        continue-on-error: true
        uses: ./setup-bazel-cache
        with:
          disk-cache-key: ${{ github.workflow }}-${{ github.job }}

      - name: Verify auto mode refused missing checkout history
        shell: bash
        run: |
          if [[ "${{ steps.setup-bazel-cache.outcome }}" != "failure" ]]; then
            echo "ERROR: setup-bazel-cache succeeded despite missing checkout history"
            exit 1
          fi
          if [[ -e "$GITHUB_WORKSPACE/.git" ]]; then
            echo "ERROR: setup-bazel-cache performed an implicit checkout"
            exit 1
          fi

  modes-without-history-check:
    name: Explicit cache modes skip history check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - disk-cache-restore: true
            repository-cache-restore: true
          - disk-cache-restore: false
            repository-cache-restore: true
          - disk-cache-restore: auto
            repository-cache-restore: true
          - disk-cache-restore: true
            repository-cache-restore: false
    steps:
      - name: Check out action source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Remove checkout metadata
        shell: bash
        run: mv "$GITHUB_WORKSPACE/.git" "$RUNNER_TEMP/setup-bazel-cache-test.git"

      - name: Run mode without Git history
        id: setup-bazel-cache
        uses: ./setup-bazel-cache
        with:
          disk-cache-key: ${{ github.workflow }}-${{ github.job }}
          cache-save-branch-patterns: no-cache-save-branch
          disk-cache-restore: ${{ matrix.disk-cache-restore }}
          repository-cache-restore: ${{ matrix.repository-cache-restore }}

      - name: Verify history and lockfile checks were skipped
        shell: bash
        run: |
          if [[ "${{ steps.setup-bazel-cache.outcome }}" != "success" ]]; then
            echo "ERROR: setup-bazel-cache failed"
            exit 1
          fi
          if [[ "${{ steps.setup-bazel-cache.outputs._checkout-history }}" != "skipped" ]]; then
            echo "ERROR: expected skipped history check, got '${{ steps.setup-bazel-cache.outputs._checkout-history }}'"
            exit 1
          fi
          if [[ "${{ steps.setup-bazel-cache.outputs._lock-file-changed }}" != "unknown" ]]; then
            echo "ERROR: expected unknown lockfile result, got '${{ steps.setup-bazel-cache.outputs._lock-file-changed }}'"
            exit 1
          fi
  preserves-existing-bazelrc:
    name: Existing user bazelrc is preserved
    runs-on: ubuntu-latest
    steps:
      - name: Check out action source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Create existing user bazelrc
        shell: bash
        run: |
          echo 'existing-home-marker' > "${HOME}/.bazelrc"
          echo 'existing-environment-marker' > "${RUNNER_TEMP}/existing.bazelrc"
          echo "BAZELRC=${RUNNER_TEMP}/existing.bazelrc" >> "$GITHUB_ENV"

      - name: Run with an existing user bazelrc
        id: setup-bazel-cache
        uses: ./setup-bazel-cache
        with:
          disk-cache-key: ${{ github.workflow }}-${{ github.job }}

      - name: Verify the user and generated bazelrc files
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.setup-bazel-cache.outcome }}" == "success" ]]
          grep -Fxq 'existing-home-marker' "${HOME}/.bazelrc"
          [[ "$(grep -Fc '# setup-bazel-cache: begin managed import' "${HOME}/.bazelrc")" == "1" ]]
          grep -Fq -- "try-import ${RUNNER_TEMP}/setup-bazel-cache.bazelrc" "${HOME}/.bazelrc"
          [[ "$(cat "${RUNNER_TEMP}/existing.bazelrc")" == "existing-environment-marker" ]]
          generated_bazelrc="${RUNNER_TEMP}/setup-bazel-cache.bazelrc"
          [[ "$BAZELRC" == "${RUNNER_TEMP}/existing.bazelrc,${generated_bazelrc}" ]]
          grep -Fq -- "--disk_cache=" "$generated_bazelrc"
          grep -Fq -- "--repository_cache=" "$generated_bazelrc"

  setup-bazel-cache:
    name: Action runs without error
    # Needs a write-capable token, which forks do not get. See the file header.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Plain checkout resolves the code under test for both same-repo
      # `pull_request` and `merge_group`. See the note in test-prune-cache.yml.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Create minimal Bazel workspace
        shell: bash
        run: |
          set -euo pipefail
          echo 'module(name = "cache_test")' > "${GITHUB_WORKSPACE}/MODULE.bazel"
          echo '8.6.0' > "${GITHUB_WORKSPACE}/.bazelversion"

      - name: Run setup-bazel-cache action
        id: setup-bazel-cache
        uses: ./setup-bazel-cache
        with:
          disk-cache-key: ${{ github.workflow }}-${{ github.job }}

      - name: Verify cache decision and restore outputs
        shell: bash
        env:
          CACHE_SAVE_ALLOWED: ${{ steps.setup-bazel-cache.outputs.cache-save-branch-evaluated }}
          EXPECTED_CACHE_SAVE: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          FAILED_JOB_CACHE_SAVE_ALLOWED: ${{ steps.setup-bazel-cache.outputs._failed-job-cache-save-allowed }}
          BAZELISK_RESTORE: ${{ steps.setup-bazel-cache.outputs.bazelisk-cache-restored }}
          DISK_RESTORE: ${{ steps.setup-bazel-cache.outputs.disk-cache-restored }}
          REPOSITORY_RESTORE: ${{ steps.setup-bazel-cache.outputs.repository-cache-restored }}
        run: |
          set -euo pipefail
          [[ "$CACHE_SAVE_ALLOWED" == "$EXPECTED_CACHE_SAVE" ]]
          [[ "$SETUP_BAZEL_CACHE_ADDITIVE_SAVE" == "$FAILED_JOB_CACHE_SAVE_ALLOWED" ]]
          for result in "$BAZELISK_RESTORE" "$DISK_RESTORE" "$REPOSITORY_RESTORE"; do
            case "$result" in
              true|false) ;;
              *)
                echo "ERROR: unexpected cache restore result: $result"
                exit 1
                ;;
            esac
          done

      - name: Verify temporary bazelrc contains cache configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$BAZELRC" ]]; then
            echo "ERROR: temporary bazelrc was not created by setup-bazel-cache"
            exit 1
          fi

          if ! grep -Fq -- "--disk_cache=" "$BAZELRC"; then
            echo "ERROR: temporary bazelrc does not contain disk_cache configuration"
            exit 1
          fi

          if ! grep -Fq -- "--repository_cache=" "$BAZELRC"; then
            echo "ERROR: temporary bazelrc does not contain repository_cache configuration"
            exit 1
          fi

          echo "Temporary bazelrc contents:"
          cat "$BAZELRC"

      - name: Run bazel info to verify workspace and cache configuration are valid
        shell: bash
        run: bazel info --announce_rc
