# Self-test for the setup-bazel-cache action, which can save caches. Cache-writing
# jobs run only on manual main-branch dispatches or write-capable contexts
# (same-repository pull requests and the merge queue). The explicit-mode test
# does not save a cache and can therefore run for fork pull requests as well.

name: Test Setup Bazel Cache

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  auto-refuses-unavailable-history:
    name: Auto mode requires checkout history
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out action source with shallow history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Make history deepening unavailable
        shell: bash
        run: |
          git remote remove origin

      - name: Run auto mode
        id: setup-bazel-cache
        continue-on-error: true
        uses: ./setup-bazel-cache
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}

      - name: Verify auto mode refused unavailable history
        shell: bash
        run: |
          if [[ "${{ steps.setup-bazel-cache.outcome }}" != "failure" ]]; then
            echo "ERROR: setup-bazel-cache succeeded despite unavailable history"
            exit 1
          fi

  auto-reuses-or-deepens-history:
    name: Auto mode resolves history
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fetch-depth: 2
            history-method: existing
          - fetch-depth: 1
            history-method: deepened
    steps:
      - name: Check out action source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch-depth }}

      - name: Run auto mode
        id: setup-bazel-cache
        uses: ./setup-bazel-cache
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}-${{ matrix.history-method }}

      - name: Verify history was ${{ matrix.history-method }}
        shell: bash
        run: |
          if [[ "${{ steps.setup-bazel-cache.outcome }}" != "success" ]]; then
            echo "ERROR: setup-bazel-cache failed"
            exit 1
          fi
          if [[ "${{ steps.setup-bazel-cache.outputs.checkout-history }}" != "${{ matrix.history-method }}" ]]; then
            echo "ERROR: expected '${{ matrix.history-method }}', got '${{ steps.setup-bazel-cache.outputs.checkout-history }}'"
            exit 1
          fi
          case "${{ steps.setup-bazel-cache.outputs.lock-file-changed }}" in
            true|false) ;;
            *)
              echo "ERROR: expected a lockfile change result, got '${{ steps.setup-bazel-cache.outputs.lock-file-changed }}'"
              exit 1
              ;;
          esac

  auto-requires-git-checkout:
    name: Auto mode requires a Git checkout
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out action source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Remove checkout metadata
        shell: bash
        run: |
          mv "$GITHUB_WORKSPACE/.git" "$RUNNER_TEMP/setup-bazel-cache-test.git"

      - name: Run auto mode
        id: setup-bazel-cache
        continue-on-error: true
        uses: ./setup-bazel-cache
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}

      - name: Verify auto mode refused missing checkout history
        shell: bash
        run: |
          if [[ "${{ steps.setup-bazel-cache.outcome }}" != "failure" ]]; then
            echo "ERROR: setup-bazel-cache succeeded despite missing checkout history"
            exit 1
          fi
          if [[ -e "$GITHUB_WORKSPACE/.git" ]]; then
            echo "ERROR: setup-bazel-cache performed an implicit checkout"
            exit 1
          fi

  modes-skip-history-check:
    name: Non-saving modes skip history check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - skip-cache-restore: false
            expected-skip-cache-restore: false
          - skip-cache-restore: true
            expected-skip-cache-restore: true
          - skip-cache-restore: auto
            expected-skip-cache-restore: false
    steps:
      - name: Check out action source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Remove checkout metadata
        shell: bash
        run: mv "$GITHUB_WORKSPACE/.git" "$RUNNER_TEMP/setup-bazel-cache-test.git"

      - name: Run mode without Git history
        id: setup-bazel-cache
        uses: ./setup-bazel-cache
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}
          main-branch: no-cache-save-branch
          skip-cache-restore: ${{ matrix.skip-cache-restore }}

      - name: Verify history and lockfile checks were skipped
        shell: bash
        run: |
          if [[ "${{ steps.setup-bazel-cache.outcome }}" != "success" ]]; then
            echo "ERROR: setup-bazel-cache failed"
            exit 1
          fi
          if [[ "${{ steps.setup-bazel-cache.outputs.checkout-history }}" != "skipped" ]]; then
            echo "ERROR: expected skipped history check, got '${{ steps.setup-bazel-cache.outputs.checkout-history }}'"
            exit 1
          fi
          if [[ "${{ steps.setup-bazel-cache.outputs.lock-file-changed }}" != "unknown" ]]; then
            echo "ERROR: expected unknown lockfile result, got '${{ steps.setup-bazel-cache.outputs.lock-file-changed }}'"
            exit 1
          fi
          if [[ "${{ steps.setup-bazel-cache.outputs.skip-cache-restore }}" != "${{ matrix.expected-skip-cache-restore }}" ]]; then
            echo "ERROR: expected skip-cache-restore=${{ matrix.expected-skip-cache-restore }}, got '${{ steps.setup-bazel-cache.outputs.skip-cache-restore }}'"
            exit 1
          fi

  setup-bazel-cache:
    name: Action runs without error
    # Needs a write-capable token, which forks do not get. See the file header.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Plain checkout resolves the code under test for both same-repo
      # `pull_request` and `merge_group`. See the note in test-prune-cache.yml.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Create minimal Bazel workspace
        shell: bash
        run: |
          set -euo pipefail
          echo 'module(name = "cache_test")' > "${GITHUB_WORKSPACE}/MODULE.bazel"
          echo '8.6.0' > "${GITHUB_WORKSPACE}/.bazelversion"

      - name: Verify ~/.bazelrc does not exist before action
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "${HOME}/.bazelrc" ]]; then
            echo "ERROR: ~/.bazelrc already exists before setup-bazel-cache ran"
            exit 1
          fi

      - name: Run setup-bazel-cache action
        uses: ./setup-bazel-cache
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}

      - name: Verify ~/.bazelrc was written by action with cache configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${HOME}/.bazelrc" ]]; then
            echo "ERROR: ~/.bazelrc was not created by setup-bazel-cache"
            exit 1
          fi

          if ! grep -Fq -- "--disk_cache=" "${HOME}/.bazelrc"; then
            echo "ERROR: ~/.bazelrc does not contain disk_cache configuration"
            exit 1
          fi

          if ! grep -Fq -- "--repository_cache=" "${HOME}/.bazelrc"; then
            echo "ERROR: ~/.bazelrc does not contain repository_cache configuration"
            exit 1
          fi

          echo "~/.bazelrc contents:"
          cat "${HOME}/.bazelrc"

      - name: Run bazel info to verify workspace and cache configuration are valid
        shell: bash
        run: bazel info --announce_rc
