name: Test Warm Bazel Repository Cache Input Check

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valid-variants:
    name: Valid variants pass validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Create minimal Bazel workspace
        shell: bash
        run: |
          set -euo pipefail

          cat <<'EOF' > "${GITHUB_WORKSPACE}/MODULE.bazel"
          module(name = "repository_cache_input_check_test")

          bazel_dep(name = "bazel_skylib", version = "1.7.1")
          EOF

          cat <<'EOF' > "${GITHUB_WORKSPACE}/BUILD.bazel"
          load("@bazel_skylib//rules:common_settings.bzl", "bool_flag")

          bool_flag(
              name = "enabled",
              build_setting_default = False,
          )
          EOF

          cat <<'EOF' > "${GITHUB_WORKSPACE}/.bazelversion"
          8.6.0
          EOF

          cat <<'EOF' > "${GITHUB_WORKSPACE}/.bazelrc"
          common:ci --color=no
          build:linux --compilation_mode=fastbuild
          EOF

      - name: Run input validation action with valid variants
        uses: ./warm-bazel-repository-cache-input-check
        with:
          variants: |
            //:enabled
            --config=ci //:enabled
            --config=linux //:enabled

  rejects-unknown-config:
    name: Unknown config fails validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Create minimal Bazel workspace
        shell: bash
        run: |
          set -euo pipefail

          cat <<'EOF' > "${GITHUB_WORKSPACE}/MODULE.bazel"
          module(name = "repository_cache_input_check_test")
          EOF

          cat <<'EOF' > "${GITHUB_WORKSPACE}/BUILD.bazel"
          filegroup(
              name = "placeholder",
              srcs = [],
          )
          EOF

          cat <<'EOF' > "${GITHUB_WORKSPACE}/.bazelversion"
          8.6.0
          EOF

          cat <<'EOF' > "${GITHUB_WORKSPACE}/.bazelrc"
          common:ci --color=no
          EOF

      - name: Run input validation action with unknown config
        id: validation
        continue-on-error: true
        uses: ./warm-bazel-repository-cache-input-check
        with:
          variants: |
            --config=linux //:placeholder

      - name: Assert validation failed
        shell: bash
        env:
          OUTCOME: ${{ steps.validation.outcome }}
        run: |
          set -euo pipefail

          if [[ "$OUTCOME" != "failure" ]]; then
            echo "Expected unknown config validation to fail, got: $OUTCOME"
            exit 1
          fi

  rejects-unsupported-option:
    name: Unsupported option fails validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Create minimal Bazel workspace
        shell: bash
        run: |
          set -euo pipefail

          cat <<'EOF' > "${GITHUB_WORKSPACE}/MODULE.bazel"
          module(name = "repository_cache_input_check_test")
          EOF

          cat <<'EOF' > "${GITHUB_WORKSPACE}/BUILD.bazel"
          filegroup(
              name = "placeholder",
              srcs = [],
          )
          EOF

          cat <<'EOF' > "${GITHUB_WORKSPACE}/.bazelversion"
          8.6.0
          EOF

          cat <<'EOF' > "${GITHUB_WORKSPACE}/.bazelrc"
          common:ci --color=no
          EOF

      - name: Run input validation action with unsupported option
        id: validation
        continue-on-error: true
        uses: ./warm-bazel-repository-cache-input-check
        with:
          variants: |
            --config=ci --keep_going //:placeholder

      - name: Assert validation failed
        shell: bash
        env:
          OUTCOME: ${{ steps.validation.outcome }}
        run: |
          set -euo pipefail

          if [[ "$OUTCOME" != "failure" ]]; then
            echo "Expected unsupported option validation to fail, got: $OUTCOME"
            exit 1
          fi

  rejects-unknown-target:
    name: Unknown target fails validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Create minimal Bazel workspace
        shell: bash
        run: |
          set -euo pipefail

          cat <<'EOF' > "${GITHUB_WORKSPACE}/MODULE.bazel"
          module(name = "repository_cache_input_check_test")
          EOF

          cat <<'EOF' > "${GITHUB_WORKSPACE}/BUILD.bazel"
          filegroup(
              name = "placeholder",
              srcs = [],
          )
          EOF

          cat <<'EOF' > "${GITHUB_WORKSPACE}/.bazelversion"
          8.6.0
          EOF

          cat <<'EOF' > "${GITHUB_WORKSPACE}/.bazelrc"
          common:ci --color=no
          EOF

      - name: Run input validation action with unknown target
        id: validation
        continue-on-error: true
        uses: ./warm-bazel-repository-cache-input-check
        with:
          variants: |
            --config=ci //:missing

      - name: Assert validation failed
        shell: bash
        env:
          OUTCOME: ${{ steps.validation.outcome }}
        run: |
          set -euo pipefail

          if [[ "$OUTCOME" != "failure" ]]; then
            echo "Expected unknown target validation to fail, got: $OUTCOME"
            exit 1
          fi
